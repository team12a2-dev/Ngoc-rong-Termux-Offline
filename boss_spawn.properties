# Cấu hình hệ thống spawn boss — chỉnh file này rồi khởi động lại server (hoặc /reload boss-spawn / BossSpawnConfig.reload())



# Bật/tắt lịch spawn (jitter + khung giờ + giới hạn + cảnh báo + phân bổ)

spawn.enabled=true



# Cảnh báo toàn server trước khi boss ELITE spawn (phút) — đã tắt; không còn gửi thông báo

spawn.elite.warn.enabled=false

spawn.elite.warn.minutes=5



# Tối đa boss đang hoạt động cùng lúc theo tier (ELITE: Fide, Cell, Bojack, Android... — tăng để không “mất” boss)

spawn.elite.max.concurrent=8

spawn.world.max.concurrent=1

spawn.normal.max.concurrent=12



# Phân bổ thông minh — khoảng cách spawn, mật độ map, hàng đợi công bằng

spawn.distribution.enabled=true

spawn.map.max.per.map=3

spawn.elite.min.gap.sec=60

spawn.world.min.gap.sec=1800

spawn.normal.min.gap.sec=30

spawn.fairness.enabled=true

# ELITE: true = xoay vòng (boss lâu chưa ra map được ưu tiên). false = không xếp hàng FIFO cho ELITE

spawn.fairness.elite.enabled=true
# Co giãn giới hạn theo số player thật online (server vắng tự giảm, server đông tự tăng)
spawn.population.adaptive.enabled=true
spawn.population.normal.players.per.boss=6
spawn.population.elite.players.per.boss=12
spawn.population.world.players.per.boss=25
spawn.population.broly.players.per.boss=5
spawn.population.superbroly.players.per.boss=20
spawn.population.superbroly.min.players=8
spawn.population.normal.min.players=1
spawn.population.elite.min.players=3
spawn.population.world.min.players=8
spawn.population.broly.min.players=1
# Cửa sổ bonus ngẫu nhiên mỗi ngày (giờ VN) — boss NORMAL/ELITE spawn thêm ngoài khung cố định

spawn.daily.bonus.enabled=true

spawn.daily.bonus.hours=2

spawn.daily.bonus.normal=true

spawn.daily.bonus.elite=true



# Trong khung giờ vẫn có xác suất trễ thêm (ngẫu nhiên hơn, khó đoán giờ chính xác)

spawn.soft.window.enabled=true

spawn.soft.window.spawn.chance=95

spawn.soft.window.defer.min.sec=30

spawn.soft.window.defer.max.sec=120



# Căn cooldown vào khung giờ hợp lệ + trải đều trong khung (tránh dồn đầu giờ)

spawn.window.align.enabled=true

spawn.intra.window.spread.min.sec=45

spawn.intra.window.spread.max.sec=480



# Bonus ngày ưu tiên giờ trống (ngoài khung NORMAL/ELITE cố định)

spawn.daily.bonus.prefer.gap=true



# Khoảng cách tối thiểu giữa spawn ELITE và WORLD (tránh 2 sự kiện lớn cùng lúc)

spawn.cross.tier.gap.sec=90



# Tăng gap khi nhiều boss cùng tier sẵn sàng — chống burst (giảm hệ số để ELITE không bị “nghẽn”)

spawn.adaptive.gap.enabled=true

spawn.adaptive.gap.per.ready.sec=12



# Boss chờ lâu trong khung giờ được ưu tiên spawn (soft window)

spawn.wait.boost.enabled=true

spawn.wait.boost.after.sec=180

spawn.wait.boost.chance=98



# Khung giờ spawn (giờ VN, inclusive). ELITE: mở rộng để boss lớn có nhiều khung trong ngày

spawn.mini.hours=all

spawn.normal.hours.weekday=9-12,14-17,19-23

spawn.normal.hours.weekend=9-12,12-14,14-17,19-23

spawn.elite.hours.weekday=9-15,18-23

spawn.elite.hours.weekend=9-23

spawn.world.hours.weekday=20-22

spawn.world.hours.weekend=19-23



# Jitter % (min-max) theo tier — nhân với secondsRest gốc (phân phối tam giác)

spawn.jitter.mini=60,140

spawn.jitter.normal=75,125

spawn.jitter.elite=85,115

spawn.jitter.world=90,110



# Trễ spawn lần đầu sau khi mở server (giây) — ELITE trải 2–15 phút thay vì 5–30 phút

spawn.stagger.mini.sec=15,180

spawn.stagger.normal.sec=60,600

spawn.stagger.elite.sec=120,900

spawn.stagger.world.sec=900,3600

# --- Broly / Super Broly ---
# Số Broly khi mở server — 15 map × 5 khu (5,13,20,27-38)
spawn.broly.initial.count=75
# Thời gian nghỉ cơ bản giữa các lần Broly xuất hiện (giây)
spawn.broly.rest.sec=180
# Tối đa Broly đang hoạt động cùng lúc
spawn.broly.max.concurrent=75
# Tối đa Broly trên một map — mỗi khu một boss (khác khu)
spawn.broly.max.per.map=5
# Khung giờ Broly — 10h đến 5h sáng hôm sau (giờ VN)
spawn.broly.hours.weekday=10-23,0-5
spawn.broly.hours.weekend=10-23,0-5
spawn.superbroly.enabled=true
# Trần an toàn; giới hạn thực tế được roll ngẫu nhiên trong khoảng dưới đây
spawn.superbroly.max.concurrent=6
spawn.superbroly.concurrent.min=1
spawn.superbroly.concurrent.max=6
# Mục tiêu tối thiểu — tăng tỉ lệ khi server đang thiếu Super Broly
spawn.superbroly.target.min=3
# Legacy: không còn là cooldown chính; cooldown thực tế được roll trong khoảng interval
spawn.superbroly.min.interval.sec=480
spawn.superbroly.interval.min.sec=240
spawn.superbroly.interval.max.sec=900
# Broly phải ở map tối thiểu trước khi chết có thể roll Super (giây)
spawn.superbroly.broly.min.active.sec=120
# Ngưỡng HP ngẫu nhiên mỗi Broly — player kích máu đạt ngưỡng rồi hạ mới roll
spawn.superbroly.hp.threshold.min=1500
spawn.superbroly.hp.threshold.max=150000
# Thang HP khi chết để tính tỉ lệ (càng cao càng dễ ra Super Broly)
spawn.superbroly.death.hp.min=1500
spawn.superbroly.death.hp.max=100000000
# Tỉ lệ % Super Broly khi Broly bị tiêu diệt (HP thấp → cao)
spawn.superbroly.transform.chance.min=8
spawn.superbroly.transform.chance.max=85
# Trễ ngẫu nhiên sau khi roll trúng rồi mới xuất hiện Super Broly (giây)
spawn.superbroly.spawn.delay.min.sec=60
spawn.superbroly.spawn.delay.max.sec=120
# 4 khung giờ con/ngày — mỗi khung tối đa 1 Super (rải thời gian)
spawn.superbroly.time.slots=4
# Giới hạn mỗi slot/map được roll lại theo profile, không cố định
spawn.superbroly.max.per.slot=1
spawn.superbroly.max.per.map=5
spawn.superbroly.slot.min=1
spawn.superbroly.slot.max=2
spawn.superbroly.map.min=1
spawn.superbroly.map.max=5
spawn.superbroly.profile.min.sec=180
spawn.superbroly.profile.max.sec=600
# Super Broly tự spawn ngẫu nhiên, không cần kích từ Broly
spawn.superbroly.natural.enabled=true
spawn.superbroly.natural.chance.percent=8
spawn.superbroly.natural.roll.min.sec=120
spawn.superbroly.natural.roll.max.sec=300
# Khung giờ Super Broly: 10h đến 5h sáng hôm sau (giờ VN)
spawn.superbroly.hours.weekday=10-23,0-5
spawn.superbroly.hours.weekend=10-23,0-5

