# Cấu hình hệ thống spawn boss — chỉnh file này rồi khởi động lại server (hoặc /reload boss-spawn / BossSpawnConfig.reload())

# Bật/tắt lịch spawn (jitter + khung giờ + giới hạn + cảnh báo + phân bổ)
spawn.enabled=true

# Cảnh báo toàn server trước khi boss ELITE spawn (phút) — đã tắt; không còn gửi thông báo
spawn.elite.warn.enabled=false
spawn.elite.warn.minutes=5

# Tối đa boss đang hoạt động cùng lúc theo tier (ELITE: Fide, Cell, Bojack, Android...)
spawn.elite.max.concurrent=8
spawn.world.max.concurrent=2
spawn.normal.max.concurrent=50

# Phân bổ thông minh — khoảng cách spawn, mật độ map, hàng đợi công bằng
spawn.distribution.enabled=true
spawn.map.max.per.map=3
spawn.elite.min.gap.sec=15
spawn.world.min.gap.sec=60
spawn.normal.min.gap.sec=10

spawn.fairness.enabled=true
spawn.fairness.elite.enabled=true

# Co giãn giới hạn theo số player thật online (đặt false để chạy offline / solo thoải mái spawn boss)
spawn.population.adaptive.enabled=false
spawn.population.normal.players.per.boss=6
spawn.population.elite.players.per.boss=12
spawn.population.world.players.per.boss=25
spawn.population.broly.players.per.boss=5
spawn.population.superbroly.players.per.boss=20
spawn.population.superbroly.min.players=0
spawn.population.normal.min.players=0
spawn.population.elite.min.players=0
spawn.population.world.min.players=0
spawn.population.broly.min.players=0

# Cửa sổ bonus ngẫu nhiên mỗi ngày (giờ VN)
spawn.daily.bonus.enabled=true
spawn.daily.bonus.hours=2
spawn.daily.bonus.normal=true
spawn.daily.bonus.elite=true

# Xác suất trễ thêm (soft window) — tắt để boss ra đúng giờ
spawn.soft.window.enabled=false
spawn.soft.window.spawn.chance=100
spawn.soft.window.defer.min.sec=10
spawn.soft.window.defer.max.sec=30

# Căn cooldown vào khung giờ hợp lệ
spawn.window.align.enabled=false
spawn.intra.window.spread.min.sec=0
spawn.intra.window.spread.max.sec=0

spawn.daily.bonus.prefer.gap=true
spawn.cross.tier.gap.sec=0
spawn.adaptive.gap.enabled=false
spawn.adaptive.gap.per.ready.sec=0

spawn.wait.boost.enabled=true
spawn.wait.boost.after.sec=60
spawn.wait.boost.chance=100

# Khung giờ spawn (all = 24/7)
spawn.mini.hours=all
spawn.normal.hours.weekday=all
spawn.normal.hours.weekend=all
spawn.elite.hours.weekday=all
spawn.elite.hours.weekend=all
spawn.world.hours.weekday=all
spawn.world.hours.weekend=all

# --- Tiểu Đội Sát Thủ (TDST) ---
# Bật xếp lịch theo khung giờ cho TDST
spawn.tdst.scheduled=true
# Khung giờ xuất hiện TDST trong ngày (vd: 8-11,13-16,18-23 hoặc all để 24/7)
spawn.tdst.hours.weekday=8-11,13-16,18-23
spawn.tdst.hours.weekend=8-11,13-16,18-23
# Thời gian hồi sinh sau khi boss chết (giây) - TDST Trái Đất: 900s - 1200s (15 - 20 phút)
spawn.tdst.rest.min.sec=900
spawn.tdst.rest.max.sec=1200
# Thời gian hồi sinh sau khi boss chết (giây) - TDST Namek: 1500s - 2100s (25 - 35 phút)
spawn.tdst.nm.rest.min.sec=1500
spawn.tdst.nm.rest.max.sec=2100

# Jitter % (min-max) theo tier
spawn.jitter.mini=80,120
spawn.jitter.normal=80,120
spawn.jitter.elite=85,115
spawn.jitter.world=90,110

# Trễ spawn lần đầu sau khi mở server (giây) — giảm xuống để boss ra nhanh
spawn.stagger.mini.sec=5,20
spawn.stagger.normal.sec=10,30
spawn.stagger.elite.sec=15,60
spawn.stagger.world.sec=30,120

# --- Broly / Super Broly ---
# Số Broly khi mở server — 15 map × 5 khu (5,13,20,27-38)
spawn.broly.initial.count=75
# Thời gian nghỉ cơ bản giữa các lần Broly xuất hiện (giây)
spawn.broly.rest.sec=180
# Tối đa Broly đang hoạt động cùng lúc
spawn.broly.max.concurrent=75
# Tối đa Broly trên một map — mỗi khu một boss (khác khu)
spawn.broly.max.per.map=5
# Khung giờ Broly — 24/7
spawn.broly.hours.weekday=all
spawn.broly.hours.weekend=all
spawn.superbroly.enabled=true
# Trần an toàn; giới hạn thực tế được roll ngẫu nhiên trong khoảng dưới đây
spawn.superbroly.max.concurrent=6
spawn.superbroly.concurrent.min=1
spawn.superbroly.concurrent.max=6
# Mục tiêu tối thiểu — tăng tỉ lệ khi server đang thiếu Super Broly
spawn.superbroly.target.min=3
spawn.superbroly.min.interval.sec=180
spawn.superbroly.interval.min.sec=120
spawn.superbroly.interval.max.sec=600
# Broly phải ở map tối thiểu trước khi chết có thể roll Super (giây)
spawn.superbroly.broly.min.active.sec=60
# Ngưỡng HP ngẫu nhiên mỗi Broly — player kích máu đạt ngưỡng rồi hạ mới roll
spawn.superbroly.hp.threshold.min=1500
spawn.superbroly.hp.threshold.max=150000
# Thang HP khi chết để tính tỉ lệ (càng cao càng dễ ra Super Broly)
spawn.superbroly.death.hp.min=1500
spawn.superbroly.death.hp.max=100000000
# Tỉ lệ % Super Broly khi Broly bị tiêu diệt (HP thấp → cao)
spawn.superbroly.transform.chance.min=15
spawn.superbroly.transform.chance.max=85
# Trễ ngẫu nhiên sau khi roll trúng rồi mới xuất hiện Super Broly (giây)
spawn.superbroly.spawn.delay.min.sec=15
spawn.superbroly.spawn.delay.max.sec=60
# Khung giờ con/ngày
spawn.superbroly.time.slots=4
spawn.superbroly.max.per.slot=1
spawn.superbroly.max.per.map=5
spawn.superbroly.slot.min=1
spawn.superbroly.slot.max=2
spawn.superbroly.map.min=1
spawn.superbroly.map.max=5
spawn.superbroly.profile.min.sec=180
spawn.superbroly.profile.max.sec=600
# Super Broly tự spawn ngẫu nhiên, không cần kích từ Broly
spawn.superbroly.natural.enabled=true
spawn.superbroly.natural.chance.percent=15
spawn.superbroly.natural.roll.min.sec=60
spawn.superbroly.natural.roll.max.sec=180
# Khung giờ Super Broly: Từ chiều tối đến rạng sáng (17h - 23h và 0h - 6h sáng)
spawn.superbroly.hours.weekday=17-23,0-6
spawn.superbroly.hours.weekend=17-23,0-6

# ==============================================================================
# TIỂU ĐỘI SÁT THỦ (TDST) & TDST NAMEK
# ==============================================================================
# Chế độ spawn:
# - false (Khuyến nghị): Spawn ĐỘC LẬP như Boss Nhiệm Vụ (Kuku/Rambo) - mở server 30-60s ra ngay, chết xong nghỉ đúng cooldown là ra lại 100%, không bị kẹt hàng đợi.
# - true: Quản lý theo bộ điều phối chung (dễ bị nghẽn bởi các boss khác).
spawn.tdst.scheduled=false

# Thời gian nghỉ sau khi bị tiêu diệt (giây) - TDST Trái Đất (mặc định 900-1200 = 15-20 phút)
spawn.tdst.rest.min.sec=900
spawn.tdst.rest.max.sec=1200

# Thời gian nghỉ sau khi bị tiêu diệt (giây) - TDST Namek (mặc định 1500-2100 = 25-35 phút)
spawn.tdst.nm.rest.min.sec=1500
spawn.tdst.nm.rest.max.sec=2100

# Khung giờ xuất hiện TDST: "all" (24/24) hoặc theo giờ như "8-11,13-16,18-23"
spawn.tdst.hours.weekday=all
spawn.tdst.hours.weekend=all

# Cơ chế "Khung giờ hỗ trợ tân thủ làm nhiệm vụ 20"
# Khi bật (true): Người chưa tới hoặc đã qua nv 20 đánh boss 0 sát thương, người xong nv 20 bị đá về nhà
# Đặt false để TẮT HOÀN TOÀN cơ chế này (bỏ vụ đánh 0 sát thương / bị đá về nhà, ai cũng đánh được)
spawn.tdst.support.hour.enabled=false
# Khung giờ áp dụng hỗ trợ nếu bật (mặc định 1h sáng và 14h chiều)
spawn.tdst.support.hours=1,14


